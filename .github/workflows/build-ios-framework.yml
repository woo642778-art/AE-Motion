name: Build iOS Extensions Framework
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/v2.0.3a-effect-integrity, feature/v2.1-project-reliability, feature/v2.2-animation-core-effect-stability, feature/v2.2-beta19-contextual-live-preview ]
  pull_request:
    branches: [ main, feature/v2.1-project-reliability, feature/v2.2-animation-core-effect-stability ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package
        run: swift package resolve
      - name: Run core tests
        id: core_tests
        continue-on-error: true
        run: swift test > swift-test.log 2>&1
      - name: Upload core test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEMotionExtensionsHost-core-test-log
          path: swift-test.log
      - name: Fail on core test error
        if: steps.core_tests.outcome == 'failure'
        run: |
          tail -n 240 swift-test.log
          exit 1
      - name: Run effect metadata tests
        run: python3 scripts/test-normalize-effect-search-metadata.py -v
      - name: Verify effect integrity tooling
        run: python3 scripts/test-effect-integrity.py -v
      - name: Verify Other category restoration
        run: python3 scripts/test-other-category-restoration.py -v
      - name: Verify runtime effect stability
        run: python3 scripts/test-effect-runtime-stability.py -v
      - name: Verify Swift 6 preset error isolation
        run: python3 scripts/test-preset-application-host-error-isolation.py
      - name: Verify native UI integration contract
        run: python3 scripts/test-ui-integration-contract.py
      - name: Verify category proxy Swift 6 isolation
        run: python3 scripts/test-category-collection-proxy-isolation.py
      - name: Verify category proxy index-path forwarding
        run: python3 scripts/test-category-proxy-indexpath-forwarding.py
      - name: Parse diagnostic and animation Swift sources
        run: |
          swiftc -frontend -parse Sources/AEMotionExtensionsHost/EffectIntegrityStore.swift
          swiftc -frontend -parse Sources/AEMotionExtensionsHost/EffectIntegrityViewController.swift
          swiftc -frontend -parse Sources/AEMotionExtensionsHost/AnimationStudioViewController.swift
      - name: Build iOS framework
        id: ios_build
        continue-on-error: true
        run: ./scripts/build-ios-framework.sh > build-ios.log 2>&1
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEMotionExtensionsHost-build-log
          path: build-ios.log
      - name: Fail on iOS build error
        if: steps.ios_build.outcome == 'failure'
        run: |
          tail -n 240 build-ios.log
          exit 1
      - name: Collect products
        run: |
          mkdir -p artifacts
          find build/DerivedData/Build/Products -name 'AEMotionExtensionsHost.framework' -type d -exec ditto -c -k --sequesterRsrc --keepParent {} artifacts/AEMotionExtensionsHost-framework.zip \;
      - uses: actions/upload-artifact@v4
        with:
          name: AEMotionExtensionsHost-iOS
          path: artifacts/*
