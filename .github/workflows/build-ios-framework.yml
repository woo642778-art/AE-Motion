name: Build iOS Extensions Framework
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - fix/home-shell-ui-restoration
      - fix/2.7.2-recovery
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package
        run: swift package resolve
      - name: Run core tests
        run: swift test
      - name: Run effect metadata tests
        run: python3 scripts/test-normalize-effect-search-metadata.py -v
      - name: Verify Swift 6 preset error isolation
        run: python3 scripts/test-preset-application-host-error-isolation.py
      - name: Verify native UI integration contract
        run: python3 scripts/test-ui-integration-contract.py
      - name: Verify category proxy Swift 6 isolation
        run: python3 scripts/test-category-collection-proxy-isolation.py
      - name: Verify category proxy index-path forwarding
        run: python3 scripts/test-category-proxy-indexpath-forwarding.py
      - name: Verify Home Shell source contracts
        id: home_contracts
        continue-on-error: true
        run: |
          set +e
          status=0
          : > home-contracts.log
          for test in scripts/test-ui271-*-contract.py; do
            echo "=== $test ===" | tee -a home-contracts.log
            python3 "$test" 2>&1 | tee -a home-contracts.log
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status=$code; fi
          done
          exit "$status"
      - name: Upload Home Shell contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEMotionUI272-build844-home-contracts
          path: home-contracts.log
          if-no-files-found: error
      - name: Fail on Home Shell contract error
        if: steps.home_contracts.outcome == 'failure'
        run: exit 1
      - name: Verify 2.7.2 integration contracts
        id: integration_contracts
        continue-on-error: true
        run: |
          set +e
          status=0
          : > integration-contracts.log
          tests=(
            scripts/test-ui272-no-legacy-loader-contract.py
            scripts/test-ui272-framework-contract.py
            scripts/test-ui272-device-regression-contract.py
            scripts/test-ui272-build843-global-shell.py
            scripts/test-ui272-build844-window-root.py
            scripts/test-macho-load-command.py
            scripts/test-known-2.7-fixes.py
            scripts/test-package-ui272-ipa.py
          )
          for test in "${tests[@]}"; do
            echo "=== $test ===" | tee -a integration-contracts.log
            python3 "$test" 2>&1 | tee -a integration-contracts.log
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status=$code; fi
          done
          exit "$status"
      - name: Upload integration contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEMotionUI272-build844-integration-contracts
          path: integration-contracts.log
          if-no-files-found: error
      - name: Fail on integration contract error
        if: steps.integration_contracts.outcome == 'failure'
        run: exit 1
      - name: Parse AE Motion UIKit sources
        run: |
          set -euo pipefail
          for source in Sources/AEMotionUI271Host/*.swift; do
            swiftc -frontend -parse "$source"
          done

  build-ios:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package
        run: swift package resolve
      - name: Build iOS framework
        id: ios_build
        continue-on-error: true
        run: ./scripts/build-ios-framework.sh > build-ios.log 2>&1
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEMotionUI272-2.7.2-build844-log
          path: build-ios.log
          if-no-files-found: ignore
      - name: Fail on iOS build error
        if: steps.ios_build.outcome == 'failure'
        run: |
          tail -n 300 build-ios.log
          exit 1
      - name: Inspect framework
        run: |
          file build/AEMotionUI272.framework/AEMotionUI272
          lipo -info build/AEMotionUI272.framework/AEMotionUI272
          otool -D build/AEMotionUI272.framework/AEMotionUI272
          plutil -p build/AEMotionUI272.framework/Info.plist
          ! strings build/AEMotionUI272.framework/AEMotionUI272 | grep -q 'AEMotionLegacy.framework'
          ! strings build/AEMotionUI272.framework/AEMotionUI272 | grep -q 'LegacyFrameworkLoader'
      - name: Collect products
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/AEMotionUI272.framework \
            artifacts/AEMotionUI272-framework.zip
          shasum -a 256 artifacts/AEMotionUI272-framework.zip \
            > artifacts/AEMotionUI272-framework.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AEMotionUI272-iOS-2.7.2-build844
          path: artifacts/*
          if-no-files-found: error
