name: Build iOS Extensions Framework
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - fix/home-shell-ui-restoration
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package
        run: swift package resolve
      - name: Run core tests
        run: swift test
      - name: Run effect metadata tests
        run: python3 scripts/test-normalize-effect-search-metadata.py -v
      - name: Verify Swift 6 preset error isolation
        run: python3 scripts/test-preset-application-host-error-isolation.py
      - name: Verify native UI integration contract
        run: python3 scripts/test-ui-integration-contract.py
      - name: Verify category proxy Swift 6 isolation
        run: python3 scripts/test-category-collection-proxy-isolation.py
      - name: Verify category proxy index-path forwarding
        run: python3 scripts/test-category-proxy-indexpath-forwarding.py
      - name: Verify AE Motion 2.7.1 source contracts
        run: |
          set -euo pipefail
          for test in scripts/test-ui271-*-contract.py; do
            python3 "$test"
          done
      - name: Parse AE Motion 2.7.1 UIKit sources
        run: |
          set -euo pipefail
          for source in Sources/AEMotionUI271Host/*.swift; do
            swiftc -frontend -parse "$source"
          done
      - name: Verify AE Motion 2.7.1 packaging
        run: python3 scripts/test-package-ui271-ipa.py

  build-ios:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package
        run: swift package resolve
      - name: Build iOS framework
        id: ios_build
        continue-on-error: true
        run: ./scripts/build-ios-framework.sh > build-ios.log 2>&1
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEMotionExtensionsHost-2.7.1-build-log
          path: build-ios.log
          if-no-files-found: ignore
      - name: Fail on iOS build error
        if: steps.ios_build.outcome == 'failure'
        run: |
          tail -n 300 build-ios.log
          exit 1
      - name: Inspect framework
        run: |
          file build/AEMotionExtensionsHost.framework/AEMotionExtensionsHost
          lipo -info build/AEMotionExtensionsHost.framework/AEMotionExtensionsHost
          otool -D build/AEMotionExtensionsHost.framework/AEMotionExtensionsHost
          plutil -p build/AEMotionExtensionsHost.framework/Info.plist
      - name: Collect products
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/AEMotionExtensionsHost.framework \
            artifacts/AEMotionExtensionsHost-framework.zip
          shasum -a 256 artifacts/AEMotionExtensionsHost-framework.zip \
            > artifacts/AEMotionExtensionsHost-framework.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AEMotionExtensionsHost-iOS-2.7.1-build839
          path: artifacts/*
          if-no-files-found: error
